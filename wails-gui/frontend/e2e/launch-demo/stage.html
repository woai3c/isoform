<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><title>Isoform launch demo</title>
<style>
  :root { --desk: #15151a; --bar: rgba(30, 30, 36, 0.78); --bar-ink: #f2f2f5; }
  :root[data-theme="paper"] { --desk: #d9d6d2; --bar: rgba(246, 244, 241, 0.82); --bar-ink: #1d1b1a; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--desk); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  .menubar { position: absolute; inset: 0 0 auto 0; height: 36px; display: flex; align-items: center; padding: 0 22px; gap: 26px; background: var(--bar); color: var(--bar-ink); font-size: 17px; letter-spacing: -0.1px; z-index: 2; }
  .menubar b { font-weight: 700; }
  .menubar .right { margin-left: auto; display: flex; align-items: center; gap: 22px; }
  .menubar img { height: 22px; }
  :root:not([data-theme="paper"]) .menubar img { filter: invert(1); }
  .window { position: absolute; left: 96px; top: 58px; width: 1440px; height: 840px; transform: scale(1.2); transform-origin: 0 0; border-radius: 12px; overflow: hidden;
    box-shadow: 0 0 0 0.5px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08) inset, 0 24px 70px rgba(0,0,0,0.45); }
  :root[data-theme="paper"] .window { box-shadow: 0 0 0 0.5px rgba(0,0,0,0.22), 0 22px 60px rgba(60,40,20,0.22); }
  .window iframe { width: 100%; height: 100%; border: 0; display: block; }
  .lights { position: absolute; left: 18px; top: 17px; display: flex; gap: 8px; z-index: 1; pointer-events: none; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.2); }
  .cursor { position: absolute; left: 0; top: 0; width: 30px; height: 44px; z-index: 5; pointer-events: none; transform-origin: 3px 3px; will-change: transform; }
</style></head>
<body>
  <div class="menubar"><b>Isoform</b><span>File</span><span>Edit</span><span>View</span><span>Window</span><span>Help</span>
    <div class="right"><img id="tray" alt="" /><span id="clock"></span></div></div>
  <div class="window"><div class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><iframe id="app"></iframe></div>
  <svg class="cursor" id="cursor" viewBox="0 0 30 44" aria-hidden="true">
    <path d="M3 3 L3 33 L10.2 26.4 L15 37.6 L19.6 35.6 L14.9 24.6 L24.6 24.6 Z" fill="#000" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" />
  </svg>
  <script type="module" src="/e2e/launch-demo/stage.ts"></script>
</body></html>
