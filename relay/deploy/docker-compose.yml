# The hosted relay on any VPS: the relay image from ../Dockerfile plus Caddy
# for TLS. Caddy runs in the relay's network namespace, so the relay keeps its
# loopback listener (plaintext on 127.0.0.1 is the only plaintext it allows)
# and only Caddy's ports 80 and 443 face the Internet.
#
# Usage (relay/deploy/README.md):
#   cp .env.example /srv/isoform-relay/relay.env   # then fill it in
#   RELAY_DOMAIN=relay.example.com CADDY_ACME_EMAIL=ops@example.com \
#   ISOFORM_RELAY_ENV_FILE=/srv/isoform-relay/relay.env \
#   docker compose -f relay/deploy/docker-compose.yml up -d --build
#
# No secret lives in this file or in the checkout: the environment file and
# the APNs key stay outside it.

name: isoform-relay

services:
  relay:
    image: isoform-relay:deploy
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - path: ${ISOFORM_RELAY_ENV_FILE:?Set the absolute path to a private relay environment file outside this checkout}
        required: true
        format: raw
    environment:
      # Loopback: Caddy shares this namespace and proxies to it.
      ISOFORM_RELAY_ADDR: 127.0.0.1:8791
      ISOFORM_RELAY_STATE_DIR: /var/lib/isoform
      # Caddy connects from loopback, the default trusted proxy, and sets
      # X-Forwarded-For, the default client header.
      ISOFORM_RELAY_LOG_FORMAT: json
      ISOFORM_RELAY_MAX_CONNS: "4096"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    volumes:
      - type: volume
        source: relay-state
        target: /var/lib/isoform
      # Optional APNs key. Point ISOFORM_RELAY_APNS_KEY_FILE in the env file at
      # /run/secrets/apns-key.p8 and set ISOFORM_RELAY_APNS_KEY_HOST_FILE to the
      # key on the host (owner UID 10001, mode 0600, outside the checkout).
      # Without APNs, leave the default: an empty read-only mount.
      - type: bind
        source: ${ISOFORM_RELAY_APNS_KEY_HOST_FILE:-/dev/null}
        target: /run/secrets/apns-key.p8
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8791/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    # Share the relay's loopback so the upstream is 127.0.0.1:8791 and no
    # plaintext leaves the namespace.
    network_mode: "service:relay"
    depends_on:
      relay:
        condition: service_started
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set the public host name the certificate is for}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?Set the e-mail Let's Encrypt notifies about the certificate}
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: volume
        source: caddy-data
        target: /data
      - type: volume
        source: caddy-config
        target: /config
    cap_drop:
      - ALL
    cap_add:
      # Ports 80 and 443 inside the shared namespace.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  # Keep the pre-rename volume names so upgrades reuse relay and Caddy state.
  relay-state:
    name: yansu-relay_relay-state
  caddy-data:
    name: yansu-relay_caddy-data
  caddy-config:
    name: yansu-relay_caddy-config
