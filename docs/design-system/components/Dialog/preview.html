<html>
<head><meta charset="utf-8"><title>Dialog — preview</title></head>
<body>
<div style="position:relative;height:320px;overflow:hidden">
  <div class="yn-scrim"></div>
  <div class="yn-dialog" role="dialog" aria-labelledby="t">
    <div class="yn-dialog__header"><h2 class="yn-dialog__title" id="t">Turn off independent work?</h2><button class="yn-close" aria-label="Close"><svg class="yn-ico" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
    <div class="yn-dialog__body"><p class="yn-dialog__desc">Initiatives already in progress stop at their next safe point. You can turn this back on in Settings.</p>
      <div class="yn-dialog__footer"><button class="yn-btn yn-btn--outline yn-btn--sm">Cancel</button><button class="yn-btn yn-btn--default yn-btn--sm">Turn off</button></div></div>
  </div>
</div>
