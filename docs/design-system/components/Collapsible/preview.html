<!-- @dsCard group="Layout" height=170 subtitle="Static rendition" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Collapsible — preview</title></head>
<body>
<div class="yn-stage"><div class="yn-panel">
  <button class="yn-trigger" aria-expanded="true">Technical details<svg class="yn-ico" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
  <div class="yn-collapse" style="grid-template-rows:1fr"><div><p>Task type: Writing · <code style="font-family:var(--font-mono);font-size:12px">compose.text</code><br>Prompt version 14</p></div></div>
</div></div>
<script>
var t=document.querySelector('.yn-trigger'),p=document.querySelector('.yn-collapse');t.addEventListener('click',function(){var o=t.getAttribute('aria-expanded')!=='true';t.setAttribute('aria-expanded',o);p.style.gridTemplateRows=o?'1fr':'0fr';p.style.opacity=o?1:0;});
</script>
</body>
</html>
