<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div class="yn-stage">
  <button class="yn-btn yn-btn--default">Continue</button>
  <button class="yn-btn yn-btn--secondary">Review plan</button>
  <button class="yn-btn yn-btn--connect">Connect</button>
  <button class="yn-btn yn-btn--ghost">Ghost</button>
  <button class="yn-btn yn-btn--outline">Cancel</button>
  <button class="yn-btn yn-btn--destructive">Turn off</button>
  <button class="yn-btn yn-btn--link">Learn more</button>
  <button class="yn-btn yn-btn--quiet yn-btn--sm">Talk about this brief</button>
</div>
<div class="yn-stage" style="padding-top:0">
  <button class="yn-btn yn-btn--default yn-btn--lg">Get started</button>
  <button class="yn-btn yn-btn--outline yn-btn--sm">Retry</button>
  <button class="yn-btn yn-btn--outline yn-btn--icon" aria-label="Edit"><svg class="yn-ico" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
  <button class="yn-btn yn-btn--default" disabled>Saving</button>
</div>
</body>
</html>
