<!-- @dsCard group="Overlays" height=330 subtitle="Static rendition" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Command — preview</title></head>
<body>
<div style="position:relative;height:330px;overflow:hidden">
  <div class="yn-scrim"></div>
  <div class="yn-cmd" style="position:absolute;top:24px;left:50%;transform:translateX(-50%)">
    <div class="yn-cmd__input-wrap"><svg class="yn-ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input class="yn-cmd__input" placeholder="Search or jump to…"></div>
    <div class="yn-cmd__list">
      <div class="yn-cmd__heading">Go to</div>
      <div class="yn-cmd__item" data-selected="true">Desk<span class="yn-kbd">⌘1</span></div>
      <div class="yn-cmd__item">History<span class="yn-kbd">⌘2</span></div>
      <div class="yn-cmd__item">About you</div>
      <div class="yn-cmd__sep"></div>
      <div class="yn-cmd__heading">Actions</div>
      <div class="yn-cmd__item"><svg class="yn-ico" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New chat</div>
    </div>
  </div>
</div>
</body>
</html>
