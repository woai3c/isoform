[project]
name = "asr-eval"
version = "0.1.0"
description = "ASR evaluation framework for comparing speech recognition engines"
requires-python = ">=3.10"
dependencies = [
    "sherpa-onnx>=1.13.0",
    "mlx-whisper>=0.4.0",
    "mlx-qwen3-asr>=0.1.0",
    "datasets>=2.14.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "jiwer>=3.0.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "tabulate>=0.9.0",
    "numpy>=1.24.0",
]

[project.scripts]
asr-eval = "evaluate:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
