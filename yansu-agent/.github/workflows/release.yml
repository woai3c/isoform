name: Trigger Yansu Agent Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  trigger-release:
    name: Trigger Release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger yansu-releases workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.YANSU_RELEASES_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Isoform/yansu-releases/dispatches \
            -d '{"event_type":"release","client_payload":{"version":"${{ inputs.version }}"}}'

      - name: Done
        run: echo "Triggered release ${{ inputs.version }} in yansu-releases repo"
